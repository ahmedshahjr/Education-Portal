name: Theme Angular quality

# Enforces the Theme Angular coding rules on every pull request and push:
#   1. Prettier with .editorconfig (format:check)
#   2. ESLint rules from eslint.config.mjs (lint)
#   3. Production build
#   4. SonarCloud analysis and quality gate (sonar-project.properties)
# Steps 1-3 fail the job on any violation. Step 4 needs the SONAR_TOKEN secret.

on:
  pull_request:
    branches: [development, main]
    paths:
      - 'Theme Angular/**'
      - '.github/workflows/theme-angular-quality.yml'
  push:
    branches: [development, main]
    paths:
      - 'Theme Angular/**'
      - '.github/workflows/theme-angular-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, build and Sonar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Theme Angular
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud needs full history for new-code detection

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Theme Angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier, .editorconfig)
        run: npm run format:check

      - name: Write ESLint report for SonarCloud
        # Writes eslint-report.json even when rules fail; the next step fails the job.
        run: npm run lint:report
        continue-on-error: true

      - name: Lint (ESLint rules)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: SonarCloud scan and quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: Theme Angular
