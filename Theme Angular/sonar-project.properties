# SonarCloud analysis for the Theme Angular project.
# Fill in the three values below from your SonarCloud project (Administration > Information).
# The CI workflow (.github/workflows/theme-angular-quality.yml) reads these and SONAR_TOKEN.
sonar.organization=TODO-sonar-organization
sonar.projectKey=TODO-sonar-project-key
sonar.projectName=Education Portal - Theme Angular

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,dist/**,.angular/**,coverage/**,public/**

# Lint results from `npm run lint:report` (ESLint JSON, rules in eslint.config.mjs)
sonar.eslint.reportPaths=eslint-report.json

sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
