<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p class="mm-confirm__message">{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close i18n="@@common.cancel">Cancel</button>
  <button mat-flat-button type="button" [mat-dialog-close]="true">{{ data.confirmLabel }}</button>
</mat-dialog-actions>
