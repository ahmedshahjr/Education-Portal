<mat-toolbar class="mm-topbar">
  <div class="mm-topbar__left">
    <button
      mat-icon-button
      type="button"
      class="mm-topbar__icon-btn"
      aria-label="Toggle navigation sidebar"
      i18n-aria-label="@@topbar.toggleSidebarLabel"
      matTooltip="Toggle sidebar"
      i18n-matTooltip="@@topbar.toggleSidebar"
      (click)="layout.toggleSidebar()"
    >
      <app-icon name="menu" [size]="20" />
    </button>
  </div>

  <div class="mm-topbar__right">
    <app-language-menu />

    <button
      mat-icon-button
      type="button"
      class="mm-topbar__icon-btn"
      [attr.aria-label]="layout.isDark() ? text.switchToLight : text.switchToDark"
      [matTooltip]="layout.isDark() ? text.lightMode : text.darkMode"
      (click)="layout.toggleThemeMode()"
    >
      <app-icon [name]="layout.isDark() ? 'sun' : 'moon'" [size]="20" />
    </button>

    <button
      type="button"
      class="mm-profile-btn"
      aria-label="Account menu"
      i18n-aria-label="@@topbar.accountMenu"
      [matMenuTriggerFor]="profileMenu"
    >
      <span class="mm-profile-avatar mm-profile-avatar--initials" aria-hidden="true">{{ initials() }}</span>
    </button>

    <mat-menu #profileMenu="matMenu" xPosition="before">
      <div class="mm-profile-menu">
        <div class="mm-profile-menu__head">
          <div class="mm-profile-menu__name">{{ branding.schoolName() }}</div>
          <div class="mm-profile-menu__role">{{ roles() }}</div>
          <div class="mm-profile-menu__email">{{ auth.currentUser()?.email }}</div>
        </div>
        <div class="mm-profile-menu__links">
          <button mat-menu-item type="button" (click)="layout.toggleCustomizer(true)">
            <app-icon name="settings" [size]="16" />
            <span i18n="@@topbar.displaySettings">Display settings</span>
          </button>
          <button mat-menu-item type="button" class="mm-signout" (click)="signOut()">
            <app-icon name="log-out" [size]="16" />
            <span i18n="@@topbar.signOut">Sign out</span>
          </button>
        </div>
      </div>
    </mat-menu>
  </div>
</mat-toolbar>
