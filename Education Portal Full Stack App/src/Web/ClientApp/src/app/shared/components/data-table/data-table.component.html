<div class="mm-table-wrap">
  @if (searchable()) {
    <div class="mm-table-toolbar">
      <div class="mm-table-toolbar__search">
        <app-search-input [value]="searchTerm()" (valueChange)="searchTerm.set($event)" [placeholder]="searchPlaceholder()" />
      </div>
      <div class="mm-table-toolbar__extra">
        <ng-content select="[table-actions]" />
      </div>
    </div>
  }

  @if (loading()) {
    <app-loading-state [rows]="5" />
  } @else if (dataSource.data.length === 0) {
    <app-empty-state
      [title]="emptyTitle()"
      [description]="emptyDescription()"
      [actionLabel]="searchTerm() ? 'Clear search' : ''"
      (action)="searchTerm.set('')"
    />
  } @else {
    <div class="mm-table-scroll">
      <table mat-table [dataSource]="dataSource" matSort class="mm-data-table">
        @for (col of columns(); track col.key) {
          <ng-container [matColumnDef]="col.key">
            <th
              mat-header-cell
              *matHeaderCellDef
              [mat-sort-header]="col.sortable === false ? '' : col.key"
              [disabled]="col.sortable === false"
              [class.text-right]="col.align === 'right'"
            >
              {{ col.header }}
            </th>
            <td mat-cell *matCellDef="let row" [class.text-right]="col.align === 'right'" (click)="rowClick.emit(row)">
              @if (col.cell) {
                <ng-container *ngTemplateOutlet="col.cell; context: { $implicit: row }" />
              } @else {
                {{ cellText(col, row) }}
              }
            </td>
          </ng-container>
        }

        <tr mat-header-row *matHeaderRowDef="displayedColumnKeys()"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumnKeys()" class="mm-data-table__row"></tr>
      </table>
    </div>

    @if (paginated()) {
      <mat-paginator [pageSize]="pageSize()" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons />
    }
  }
</div>
