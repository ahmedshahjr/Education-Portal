<app-page-header
  title="Academic calendar"
  i18n-title="@@academicCalendar.title"
  subtitle="Academic years and terms, the shifts of each campus, and the school's holidays and events."
  i18n-subtitle="@@academicCalendar.subtitle"
></app-page-header>

<mat-tab-group class="mm-academic__tabs" animationDuration="0ms" mat-stretch-tabs="false">
  <mat-tab label="Calendar" i18n-label="@@academicCalendar.tabCalendar">
    <ng-template matTabContent>
      <div class="mm-academic__tab"><app-school-calendar-panel [campuses]="campuses()" /></div>
    </ng-template>
  </mat-tab>
  <mat-tab label="Academic years" i18n-label="@@academicCalendar.tabYears">
    <ng-template matTabContent>
      <div class="mm-academic__tab"><app-academic-years-panel /></div>
    </ng-template>
  </mat-tab>
  <mat-tab label="Shifts" i18n-label="@@academicCalendar.tabShifts">
    <ng-template matTabContent>
      <div class="mm-academic__tab"><app-shifts-panel [campuses]="campuses()" /></div>
    </ng-template>
  </mat-tab>
</mat-tab-group>
