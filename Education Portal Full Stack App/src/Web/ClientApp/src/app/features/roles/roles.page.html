<app-page-header
  title="Roles"
  i18n-title="@@roles.title"
  subtitle="What each role of the school may do in each module: view, create, edit, delete, approve and export."
  i18n-subtitle="@@roles.subtitle"
></app-page-header>

@if (loadError(); as message) {
  <app-empty-state
    icon="alert-triangle"
    title="Roles could not be loaded"
    i18n-title="@@roles.loadError"
    [description]="message"
    actionLabel="Try again"
    i18n-actionLabel="@@common.tryAgain"
    (action)="load()"
  />
} @else {
  <div class="mm-roles__toolbar">
    <button mat-flat-button type="button" [disabled]="busy() || roles() === null" (click)="openDialog(null)" i18n="@@roles.add">Add role</button>
  </div>

  <mat-card class="mm-card mm-elevated">
    <mat-card-content>
      <app-data-table
        [data]="roles() ?? []"
        [columns]="columns()"
        [loading]="roles() === null"
        searchPlaceholder="Search roles..."
        i18n-searchPlaceholder="@@roles.search"
        emptyTitle="No roles yet"
        i18n-emptyTitle="@@roles.none"
        emptyDescription="Add a role: choose what it may do in each module."
        i18n-emptyDescription="@@roles.noneDescription"
      />
      @for (message of errors(); track message) {
        <p class="mm-roles__error" role="alert">{{ message }}</p>
      }
    </mat-card-content>
  </mat-card>
}

<ng-template #nameCell let-role>
  <span class="mm-roles__name">
    <span>{{ role.name }}</span>
    @if (role.isSystem) {
      <app-status-badge tone="primary" i18n="@@roles.builtIn">Built-in</app-status-badge>
    }
  </span>
  @if (role.description) {
    <span class="mm-roles__description">{{ role.description }}</span>
  }
</ng-template>

<ng-template #actionsCell let-role>
  <span class="mm-crud-actions">
    <button mat-icon-button type="button" [disabled]="busy()" [attr.aria-label]="'Edit ' + role.name" i18n-aria-label="@@roles.editRole" (click)="$event.stopPropagation(); openDialog(role)">
      <app-icon name="edit-3" [size]="16" />
    </button>
    @if (!role.isSystem) {
      <button mat-icon-button type="button" class="mm-delete-btn" [disabled]="busy()" [attr.aria-label]="'Delete ' + role.name" i18n-aria-label="@@roles.deleteRole" (click)="$event.stopPropagation(); confirmDelete(role)">
        <app-icon name="trash-2" [size]="16" />
      </button>
    }
  </span>
</ng-template>
