<h2 mat-dialog-title>{{ data.title }}</h2>

<form [formGroup]="form" (ngSubmit)="save()" novalidate>
  <mat-dialog-content class="mm-set-price-dialog">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label i18n="@@priceBooks.price">Price</mat-label>
      <input matInput type="number" formControlName="price" min="0" step="0.01" dir="ltr" />
      <span matTextSuffix dir="ltr">&nbsp;{{ data.currencyCode }}</span>
      <mat-hint i18n="@@priceBooks.priceHint">Zero makes the module or plan free in this country.</mat-hint>
      @if (form.controls.price.invalid) {
        <mat-error i18n="@@priceBooks.priceError">Enter an amount of zero or more, with at most two decimal places.</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close i18n="@@common.cancel">Cancel</button>
    <button mat-flat-button type="submit" [disabled]="form.invalid" i18n="@@common.save">Save</button>
  </mat-dialog-actions>
</form>
