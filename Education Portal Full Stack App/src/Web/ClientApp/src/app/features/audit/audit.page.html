<app-page-header
  title="Change history"
  i18n-title="@@audit.title"
  subtitle="The latest changes made in the school: links, roles, subscriptions and invoices. Read only."
  i18n-subtitle="@@audit.subtitle"
/>

<mat-card class="mm-card mm-elevated">
  <mat-card-content>
    @if (loadError(); as message) {
      <app-empty-state
        icon="alert-triangle"
        title="The change history could not be loaded"
        i18n-title="@@audit.loadError"
        [description]="message"
        actionLabel="Try again"
        i18n-actionLabel="@@common.tryAgain"
        (action)="load()"
      />
    } @else if (entries(); as items) {
      @if (items.length === 0) {
        <app-empty-state
          icon="file-text"
          title="No changes recorded yet"
          i18n-title="@@audit.empty"
        />
      } @else {
        <div class="mm-audit__scroll">
          <table mat-table [dataSource]="items" class="mm-audit__table">
            <ng-container matColumnDef="when">
              <th mat-header-cell *matHeaderCellDef i18n="@@audit.when">When</th>
              <td mat-cell *matCellDef="let entry">{{ entry.occurredAt | localDate: 'dateTime' }}</td>
            </ng-container>

            <ng-container matColumnDef="action">
              <th mat-header-cell *matHeaderCellDef i18n="@@audit.action">Action</th>
              <td mat-cell *matCellDef="let entry">{{ entry.action }}</td>
            </ng-container>

            <ng-container matColumnDef="record">
              <th mat-header-cell *matHeaderCellDef i18n="@@audit.record">Record</th>
              <td mat-cell *matCellDef="let entry"><bdi dir="ltr">{{ entry.entityType }}</bdi></td>
            </ng-container>

            <ng-container matColumnDef="changes">
              <th mat-header-cell *matHeaderCellDef i18n="@@audit.changes">Changes</th>
              <td mat-cell *matCellDef="let entry"><code class="mm-audit__changes" dir="ltr">{{ entry.changes }}</code></td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="columns"></tr>
            <tr mat-row *matRowDef="let row; columns: columns"></tr>
          </table>
        </div>
      }
    } @else {
      <app-loading-state />
    }
  </mat-card-content>
</mat-card>
